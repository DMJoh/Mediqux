name: Semgrep

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        # No --error: in --sarif mode, Semgrep counts nosemgrep-suppressed
        # findings as "blocking" for its own exit code even though it
        # correctly marks them `suppressions: inSource` in the SARIF itself
        # (verified — this differs from plain/--json mode, where suppressed
        # findings are excluded entirely). Actual gating happens on GitHub's
        # side: Code Scanning surfaces every SARIF result regardless of that
        # suppression metadata, so a legitimate exception here is closed by
        # dismissing the resulting alert in the Security tab, not by this
        # job's exit code.
        run: |
          semgrep scan \
            --config .semgrep/patient-scoping.yml \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif --output semgrep.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          sarif_file: semgrep.sarif
